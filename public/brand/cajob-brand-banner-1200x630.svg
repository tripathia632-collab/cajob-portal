    <!-- Swatch 4 -->
    <g transform="translate(462 0)">
      <rect width="130" height="70" rx="12" fill="#D0F69E" stroke="#E5FFB8" stroke-width="1.5"/>
      <text x="65" y="38" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#102D37">#D0F69E</text>
      <text x="65" y="56" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="600" fill="#102D37">Pastel Lime</text>
