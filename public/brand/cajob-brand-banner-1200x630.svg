      <stop offset="50%" stop-color="#102D37" stop-opacity="1"/>
      <stop offset="100%" stop-color="#081A20" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="og-door-glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#08765D" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#76D7B2" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#102D37" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dark-icon-front" x1="42" y1="26" x2="131" y2="166" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e5ffb8"/><stop offset=".32" stop-color="#c7f39d"/><stop offset=".7" stop-color="#76d7b2"/><stop offset="1" stop-color="#48adab"/>
    </linearGradient>
