      <text x="65" y="38" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#102D37">#76D7B2</text>
      <text x="65" y="56" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="600" fill="#102D37">Sea Glass</text>
