<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bg-glow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#174857" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#102D37" stop-opacity="1"/>
      <stop offset="100%" stop-color="#081A20" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="door-glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#08765D" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#76D7B2" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#102D37" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#76D7B2" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#08765D" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Doorway Logo Gradients (Exact brand specification) -->
    <linearGradient id="dark-icon-front" x1="42" y1="26" x2="131" y2="166" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e5ffb8"/>
      <stop offset=".32" stop-color="#c7f39d"/>
      <stop offset=".7" stop-color="#76d7b2"/>
      <stop offset="1" stop-color="#48adab"/>
    </linearGradient>
    <linearGradient id="dark-icon-side" x1="94" y1="9" x2="149" y2="162" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b0e9bb"/>
      <stop offset=".4" stop-color="#5faba6"/>
      <stop offset="1" stop-color="#256477"/>
    </linearGradient>
    <linearGradient id="dark-icon-inner" x1="92" y1="38" x2="123" y2="148" gradientUnits="userSpaceOnUse">
      <stop stop-color="#34716d"/>
      <stop offset="1" stop-color="#4f9794"/>
    </linearGradient>
    <linearGradient id="dark-icon-threshold" x1="44" y1="165" x2="120" y2="183" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c9f6a7"/>
      <stop offset=".5" stop-color="#8ed8b6"/>
      <stop offset="1" stop-color="#2f7c88"/>
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <circle cx="24" cy="24" r="1.2" fill="#76D7B2" fill-opacity="0.08"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1920" height="1080" fill="url(#bg-glow)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>

  <!-- Radial Glow Behind Doorway -->
  <ellipse cx="960" cy="380" rx="600" ry="380" fill="url(#door-glow)"/>

  <!-- Top Decorative Header Pill -->
  <g transform="translate(960 90)">
    <rect x="-180" y="-18" width="360" height="36" rx="18" fill="#174450" fill-opacity="0.8" stroke="#2a6575" stroke-width="1.5"/>
    <circle cx="-150" cy="0" r="4" fill="#76D7B2"/>
    <text x="-135" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#A7E9D4" text-anchor="start">CAJOB.IN BRAND IDENTITY</text>
  </g>

  <!-- Central Doorway Icon (Rendered large & crisp) -->
  <g transform="translate(860 140) scale(1.15)">
    <path d="M82 18L98 9C128 9 150 34 150 69V153L134 162V78C134 43 112 18 82 18Z" fill="url(#dark-icon-side)"/>
    <path d="M82 39L98 30C114 30 126 47 126 70V144L110 153V79C110 56 98 39 82 39Z" fill="url(#dark-icon-inner)"/>
    <path d="M30 162V78C30 43 52 18 82 18C112 18 134 43 134 78V162L110 153V79C110 56 98 39 82 39C66 39 54 56 54 79V153Z" fill="url(#dark-icon-front)"/>
    <path d="M35 145V78C35 46 55 23 82 23" fill="none" stroke="#f3ffd9" stroke-opacity=".6" stroke-width="1.35"/>
    <path d="M55 150V79C55 57 67 40 82 40" fill="none" stroke="#e1ffcc" stroke-opacity=".67" stroke-width="1.2"/>
    <path d="M134 79V158" stroke="#a6e8ce" stroke-opacity=".45" stroke-width="1"/>
    <path d="M139 116V143" stroke="#a5ddd2" stroke-opacity=".6" stroke-width="1"/>
    <path d="M54 165L82 174L110 165L120 169L82 183L44 170Z" fill="url(#dark-icon-threshold)"/>
    <path d="M57 167L82 175L107 167" fill="none" stroke="#dbffc0" stroke-opacity=".75" stroke-width="1"/>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(960 410)">
    <text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="76" font-weight="900" letter-spacing="-1.5">
      <tspan fill="#FFFFFF">cajob</tspan><tspan fill="#76D7B2">.in</tspan>
    </text>
    <text y="58" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="24" font-weight="600" fill="#EAF4EF" letter-spacing="0.5">
      The Dedicated Career Platform for CAs &amp; Finance
    </text>
    <text y="98" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="16" font-weight="500" fill="#8CA89A" letter-spacing="1">
      ARTICLESHIP  ·  INDUSTRIAL TRAINING  ·  QUALIFIED CA  ·  CORE FINANCE
    </text>
  </g>

  <!-- Divider Line -->
  <line x1="360" y1="560" x2="1560" y2="560" stroke="#255563" stroke-width="1" stroke-dasharray="8 8"/>

  <!-- COLOR THEME PALETTE SHOWCASE HEADER -->
  <g transform="translate(960 610)">
    <text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="14" font-weight="700" letter-spacing="3" fill="#76D7B2">
      OFFICIAL WEBSITE COLOR PALETTE &amp; SYSTEM
    </text>
  </g>

  <!-- 6 COLOR PALETTE CARDS (Evenly spaced across 1920 width) -->
  <!-- Card 1: Midnight / Deep Pine #102D37 -->
  <g transform="translate(195 650)">
    <rect width="230" height="270" rx="20" fill="#0C252E" stroke="#1F4E5C" stroke-width="1.5"/>
    <!-- Swatch -->
    <rect x="20" y="20" width="190" height="120" rx="14" fill="#102D37" stroke="#2A6575" stroke-width="1"/>
    <!-- Color Info -->
    <text x="25" y="172" font-family="monospace" font-size="18" font-weight="700" fill="#FFFFFF">#102D37</text>
    <text x="25" y="200" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="#EAF4EF">Midnight Pine</text>
    <text x="25" y="224" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500" fill="#8CA89A">Primary Dark Theme</text>
    <text x="25" y="244" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="500" fill="#5F8379">Header &amp; Footers</text>
  </g>

  <!-- Card 2: Emerald Forest #08765D -->
  <g transform="translate(455 650)">
    <rect width="230" height="270" rx="20" fill="#0C252E" stroke="#1F4E5C" stroke-width="1.5"/>
    <!-- Swatch -->
    <rect x="20" y="20" width="190" height="120" rx="14" fill="#08765D" stroke="#0FA885" stroke-width="1"/>
    <!-- Color Info -->
    <text x="25" y="172" font-family="monospace" font-size="18" font-weight="700" fill="#76D7B2">#08765D</text>
    <text x="25" y="200" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="#EAF4EF">Emerald Forest</text>
    <text x="25" y="224" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500" fill="#8CA89A">Primary Brand Action</text>
    <text x="25" y="244" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="500" fill="#5F8379">Buttons &amp; Highlights</text>
  </g>

  <!-- Card 3: Sea Glass Mint #76D7B2 -->
  <g transform="translate(715 650)">
    <rect width="230" height="270" rx="20" fill="#0C252E" stroke="#1F4E5C" stroke-width="1.5"/>
    <!-- Swatch -->
    <rect x="20" y="20" width="190" height="120" rx="14" fill="#76D7B2" stroke="#A7E9D4" stroke-width="1"/>
    <!-- Color Info -->
    <text x="25" y="172" font-family="monospace" font-size="18" font-weight="700" fill="#76D7B2">#76D7B2</text>
    <text x="25" y="200" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="#EAF4EF">Sea Glass Mint</text>
    <text x="25" y="224" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500" fill="#8CA89A">Vibrant Accent</text>
    <text x="25" y="244" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="500" fill="#5F8379">Badges &amp; Active Dots</text>
  </g>

  <!-- Card 4: Pastel Lime #D0F69E -->
  <g transform="translate(975 650)">
    <rect width="230" height="270" rx="20" fill="#0C252E" stroke="#1F4E5C" stroke-width="1.5"/>
    <!-- Swatch -->
    <rect x="20" y="20" width="190" height="120" rx="14" fill="#D0F69E" stroke="#E5FFB8" stroke-width="1"/>
    <!-- Color Info -->
    <text x="25" y="172" font-family="monospace" font-size="18" font-weight="700" fill="#D0F69E">#D0F69E</text>
    <text x="25" y="200" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="#EAF4EF">Pastel Lime</text>
    <text x="25" y="224" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500" fill="#8CA89A">Atmosphere &amp; Glow</text>
    <text x="25" y="244" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="500" fill="#5F8379">Threshold &amp; Seams</text>
  </g>

  <!-- Card 5: Soft Sage #EAF4EF -->
  <g transform="translate(1235 650)">
    <rect width="230" height="270" rx="20" fill="#0C252E" stroke="#1F4E5C" stroke-width="1.5"/>
    <!-- Swatch -->
    <rect x="20" y="20" width="190" height="120" rx="14" fill="#EAF4EF" stroke="#BCDEC8" stroke-width="1"/>
    <!-- Color Info -->
    <text x="25" y="172" font-family="monospace" font-size="18" font-weight="700" fill="#EAF4EF">#EAF4EF</text>
    <text x="25" y="200" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="#EAF4EF">Soft Sage</text>
    <text x="25" y="224" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500" fill="#8CA89A">Light Surface Tint</text>
    <text x="25" y="244" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="500" fill="#5F8379">Pills &amp; Cards</text>
  </g>

  <!-- Card 6: Pure Snow #FFFFFF -->
  <g transform="translate(1495 650)">
    <rect width="230" height="270" rx="20" fill="#0C252E" stroke="#1F4E5C" stroke-width="1.5"/>
    <!-- Swatch -->
    <rect x="20" y="20" width="190" height="120" rx="14" fill="#FFFFFF" stroke="#E1ECE5" stroke-width="1"/>
    <!-- Color Info -->
    <text x="25" y="172" font-family="monospace" font-size="18" font-weight="700" fill="#FFFFFF">#FFFFFF</text>
    <text x="25" y="200" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="#EAF4EF">Pure Snow</text>
    <text x="25" y="224" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500" fill="#8CA89A">Clean Contrast</text>
    <text x="25" y="244" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="500" fill="#5F8379">Cards &amp; Headings</text>
  </g>

  <!-- Footer Signature -->
  <g transform="translate(960 990)">
    <text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500" fill="#5F8379" letter-spacing="1">
      © 2026 CAJOB.IN  ·  ALL ASSETS &amp; BRAND CODES ARE DESIGNED FOR ULTRA HD CLARITY
    </text>
  </g>
</svg>
